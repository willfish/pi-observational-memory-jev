<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="ptitle pdesc">
  <title id="ptitle">Observational memory pipeline</title>
  <desc id="pdesc">Session history is chunked and scored by Jev into a verbatim ledger. Compaction prints that ledger as-is. Overflow promotes lines into durable topic files.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="24" fill="#0b1220"/>
  <rect x="16" y="16" width="1068" height="488" rx="18" fill="none" stroke="#334155" stroke-width="2"/>

  <g font-family="Noto Sans, Arial, Helvetica, sans-serif">
    <rect x="40" y="48" width="200" height="88" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="140" y="84" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="1.5">SESSION</text>
    <text x="140" y="110" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">History</text>

    <line x1="240" y1="92" x2="278" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="286" y="48" width="200" height="88" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="386" y="84" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="1.5">CUT</text>
    <text x="386" y="110" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Chunks</text>

    <line x1="486" y1="92" x2="524" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="532" y="48" width="220" height="88" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="642" y="80" text-anchor="middle" fill="#818cf8" font-size="12" letter-spacing="1.5">JEV</text>
    <text x="642" y="108" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">keep + kind</text>

    <line x1="752" y1="92" x2="790" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="798" y="40" width="262" height="104" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="929" y="80" text-anchor="middle" fill="#34d399" font-size="12" letter-spacing="1.5">SHORT-TERM BUFFER</text>
    <text x="929" y="110" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Verbatim ledger</text>

    <path d="M 860 144 L 860 176 L 290 176 L 290 196" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="980" y1="144" x2="980" y2="196" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="430" y="168" fill="#64748b" font-size="12">render as-is</text>
    <text x="992" y="176" fill="#64748b" font-size="12">pool overflow</text>

    <rect x="40" y="208" width="500" height="268" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="64" y="248" fill="#34d399" font-size="13" letter-spacing="2">COMPACTION</text>
    <text x="64" y="286" fill="#f8fafc" font-size="22" font-weight="700">Model-free render</text>
    <text x="64" y="322" fill="#cbd5e1" font-size="16">Prints the ledger and topic files as-is.</text>
    <text x="64" y="348" fill="#cbd5e1" font-size="16">No second language-model summary.</text>
    <text x="64" y="400" fill="#94a3b8" font-size="15">/tree rolls the buffer back with the branch.</text>
    <text x="64" y="424" fill="#94a3b8" font-size="15">Spend and topic files do not roll back.</text>

    <rect x="572" y="208" width="488" height="268" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="596" y="248" fill="#fbbf24" font-size="13" letter-spacing="2">DURABLE TOPICS · .memory/session/</text>
    <text x="596" y="286" fill="#f8fafc" font-size="22" font-weight="700">Kind-keyed files</text>
    <text x="596" y="332" fill="#e2e8f0" font-size="16">facts.md</text>
    <text x="780" y="332" fill="#e2e8f0" font-size="16">decisions.md</text>
    <text x="596" y="362" fill="#e2e8f0" font-size="16">constraints.md</text>
    <text x="780" y="362" fill="#e2e8f0" font-size="16">questions.md</text>
    <text x="596" y="392" fill="#e2e8f0" font-size="16">corrections.md</text>
    <text x="780" y="392" fill="#e2e8f0" font-size="16">hypotheses.md</text>
    <text x="596" y="434" fill="#fbbf24" font-size="16">JOURNEY.md</text>
  </g>
</svg>
